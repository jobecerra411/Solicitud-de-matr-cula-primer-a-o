# Configuracion de conexion a MySQL 8
# Ajustar host, puerto, usuario y password segun el entorno real.

db.url=jdbc:mysql://localhost:3306/registro_personas?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
db.user=root
db.password=root

# Configuracion del pool HikariCP
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.connectionTimeoutMs=10000
db.pool.idleTimeoutMs=300000
db.pool.maxLifetimeMs=1800000
